global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: mimir-local
    env: dev

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: mimir-api
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets:
          - 'host.docker.internal:9090'
        labels:
          service: mimir-api
          component: backend

  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          service: cadvisor
